limit_req_zone $binary_remote_addr zone=legacy_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.legacyhosting.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.legacyhosting.xyz;

    ssl_certificate /etc/letsencrypt/live/api.legacyhosting.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.legacyhosting.xyz/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/lh-api.access.log;
    error_log /var/log/nginx/lh-api.error.log;
    client_max_body_size 1m;
    limit_req zone=legacy_api burst=40 nodelay;

    location ~ ^/api/v1/panel/applications/.*/commands/.*/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35m;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
